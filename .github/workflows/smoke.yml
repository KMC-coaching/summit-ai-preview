name: Smoke test on every kind of computer

# The whole pipeline a student's machine runs (find the workbook file, fetch Node,
# check, build, serve, load every page, Lighthouse, restart), on Windows, both Mac
# chips and Linux, with the Python a Mac ships (3.9) and a current one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.9" }
          - { os: macos-15, python: "3.9" }        # Apple silicon, the Python Apple's tools install
          - { os: macos-15-intel, python: "3.9" }  # Intel Mac
          - { os: ubuntu-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the smoke test
        run: python tests/smoke.py
      - name: Keep what the new site's audit wrote
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            app/data/grade-preview.json
            .preview-audit.log
            .preview-server.log
          if-no-files-found: ignore

  # A brand-new machine: no checkout, no Git, no GitHub login. Fetch the preview exactly the
  # way START-HERE tells a student's Claude to (curl, unauthenticated), unpack it, and run the
  # whole smoke test from that download. Fails at once if the repo is not reachable without
  # signing in. Runs on main only: that is the address students download from.
  fresh-download:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Download START-HERE and the folder with no login
        run: |
          set -e
          cd "$RUNNER_TEMP"
          code=$(curl -s -o START-HERE.md -w "%{http_code}" https://raw.githubusercontent.com/KMC-coaching/summit-ai-preview/main/START-HERE.md)
          echo "START-HERE.md: HTTP $code"; test "$code" = 200
          code=$(curl -sL -o preview.zip -w "%{http_code}" https://codeload.github.com/KMC-coaching/summit-ai-preview/zip/refs/heads/main)
          echo "folder zip: HTTP $code"; test "$code" = 200
          unzip -q preview.zip && mv summit-ai-preview-main AI-Preview
      - name: Run the smoke test from the download
        run: cd "$RUNNER_TEMP/AI-Preview" && python tests/smoke.py
